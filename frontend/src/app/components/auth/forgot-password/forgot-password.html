<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-success text-white d-flex align-items-center justify-content-center gap-2 py-3">
          <img src="assets/images/agriguide_logo.png" alt="Agri Guide" class="auth-brand-logo" />
          <h3 class="mb-0 auth-brand-title">Reset Password</h3>
        </div>

        <div class="card-body p-4">
          @if (successMessage) {
            <div class="alert alert-success" role="status">
              {{ successMessage }}
            </div>
          }

          @if (errorMessage) {
            <div class="alert alert-danger" role="alert">
              {{ errorMessage }}
            </div>
          }

          <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" novalidate>
            <div class="mb-4">
              <label for="identifier" class="form-label fw-semibold">Email or username</label>
              <input
                id="identifier"
                type="text"
                class="form-control"
                placeholder="Enter your email or username"
                formControlName="identifier"
              />
              @if (
                forgotPasswordForm.controls.identifier.touched &&
                forgotPasswordForm.controls.identifier.invalid
              ) {
                <div class="text-danger small mt-1">Email or username is required.</div>
              }
            </div>

            <button type="submit" class="btn btn-success w-100 fw-semibold" [disabled]="loading">
              @if (loading) {
                <span class="spinner-border spinner-border-sm me-2"></span>
                Sending...
              } @else {
                Send Reset Link
              }
            </button>
          </form>

          <div class="text-center mt-3">
            <a routerLink="/login" class="text-success fw-semibold">Back to Login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
